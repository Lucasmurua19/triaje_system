services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: triaje_user
      POSTGRES_PASSWORD: triaje_pass
      POSTGRES_DB: triaje_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5454:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U triaje_user -d triaje_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://triaje_user:triaje_pass@db:5432/triaje_db
      SECRET_KEY: ${SECRET_KEY:-changeme-super-secret-key}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
